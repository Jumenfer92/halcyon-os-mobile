<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Halcyon OS</title>
<meta name="description" content="Escritorio de The Realm: correo, foro, noticias y la Puerta de palabras clave.">
<meta name="theme-color" content="#0b1622">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Halcyon">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oxanium:wght@400;600;700&family=Noto+Sans:wght@400;600&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<canvas id="wall" aria-hidden="true"></canvas>

<!-- HOME -->
<main id="home" class="screen">
  <header class="status">
    <span class="brand">HALCYON<span>/</span>OS</span>
    <button id="statusMail" class="smail" aria-label="Correo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg><span class="badge" id="mailBadge" data-n="0">0</span></button>
    <span id="clock">--:--</span>
  </header>
  <section class="hello">
    <p class="eyebrow" id="dateLine">—</p>
    <h1 id="helloName">Hola</h1>
  </section>
  <section class="widget" id="widget" aria-live="polite"></section>
  <nav class="grid" id="grid" aria-label="Aplicaciones"></nav>
</main>

<!-- APP SCREEN (one at a time) -->
<section id="app" class="screen app" hidden>
  <header class="appbar">
    <button id="back" class="back" aria-label="Atrás"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 5l-7 7 7 7"/></svg></button>
    <h2 id="appTitle">App</h2>
    <span id="appAction"></span>
  </header>
  <div id="appBody" class="appbody"></div>
</section>

<div id="toasts" aria-live="polite"></div>
<canvas id="glitch" hidden aria-hidden="true"></canvas>

<!-- INSTALL BANNER -->
<aside id="install" class="install" hidden role="dialog" aria-labelledby="installTitle">
  <img src="icons/icon-192.png" alt="" width="48" height="48">
  <div class="itext">
    <b id="installTitle">Instala Halcyon OS</b>
    <p id="installText">Tenlo en tu pantalla de inicio, a pantalla completa y sin barra del navegador.</p>
  </div>
  <div class="iact">
    <button id="installYes" class="btn amber">Instalar</button>
    <button id="installNo" class="btn ghost">Ahora no</button>
  </div>
</aside>

<!-- BOOT -->
<div id="boot">
  <div class="term">
    <div class="logo">HALCYON<span>/</span>OS</div>
    <div class="ver">VER 2.04 · EDICIÓN MÓVIL</div>
    <div id="bootlog"></div>
    <form id="login" hidden>
      <label for="handle">Nombre de usuario</label>
      <input id="handle" maxlength="16" autocomplete="off" autocapitalize="off" value="Kai">
      <button class="btn amber" type="submit">Iniciar sesión</button>
    </form>
  </div>
</div>

<script src="core.js"></script>
<script src="app.js"></script>
</body>
</html>
